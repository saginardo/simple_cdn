user www-data;
include /opt/cdn-edge/config/nginx/cdn-platform-main.conf;

error_log /opt/cdn-edge/logs/nginx-error.log warn;
pid /opt/cdn-edge/nginx/run/nginx.pid;

events {
    include /opt/cdn-edge/config/nginx/cdn-platform-events.conf;
}

http {
    include /opt/cdn-edge/nginx/conf/mime.types;
    default_type application/octet-stream;

    lua_package_path '/opt/cdn-edge/nginx/lib/lua/5.1/?.lua;/opt/cdn-edge/nginx/lib/lua/5.1/?/init.lua;;';

    client_body_temp_path /opt/cdn-edge/nginx/tmp/body;
    proxy_temp_path /opt/cdn-edge/nginx/tmp/proxy;
    fastcgi_temp_path /opt/cdn-edge/nginx/tmp/fastcgi;
    uwsgi_temp_path /opt/cdn-edge/nginx/tmp/uwsgi;
    scgi_temp_path /opt/cdn-edge/nginx/tmp/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen unix:/opt/cdn-edge/nginx/run/status.sock;
        server_name localhost;
        access_log off;

        location = /stub_status {
            stub_status;
        }
    }

    include /opt/cdn-edge/config/nginx/cdn-platform.conf;
}

stream {
    include /opt/cdn-edge/config/nginx/cdn-platform-stream.conf;
}
